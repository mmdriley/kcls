name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository }}
  PROJECT_ID: kcls-484205
  REGION: us-west1
  SERVICE_NAME: kcls-app
  WIF_PROVIDER: projects/97975407086/locations/global/workloadIdentityPools/kcls-pool-v2/providers/kcls-gh-provider
  WIF_SERVICE_ACCOUNT: kcls-app-sa@kcls-484205.iam.gserviceaccount.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # Required for Workload Identity Federation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Build and Push to GHCR
      - name: ghcr.io login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Authenticate to Google Cloud
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      # Deploy to Cloud Run
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ghcr.io/${{ env.IMAGE_NAME }}:latest
          env_vars: KCLS_SECRETS_BUCKET=kcls-secrets-145401d9
          flags: --allow-unauthenticated